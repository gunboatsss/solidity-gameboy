[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/roms/" }]
# 2^30 default is too small for multi-frame runs (a frame is ~50-100M gas);
# local validation only — production per-tx budget is a separate concern.
gas_limit = 274877906944

# 24KiB-deployable variant: slimmed copy in slim/ (no SSTORE2, no stepping,
# storage ROM via constructor, runFrame only). Run with:
# FOUNDRY_PROFILE=deploy forge build|test
[profile.deploy]
src = "slim"
test = "slim/test"
out = "out-slim"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/roms/" }, { access = "read-write", path = "./frontend/" }]
gas_limit = 274877906944

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
